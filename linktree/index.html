<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>My Linktree Clone</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="profile-container">
            <!-- STUDENT TASK: Replace this with your own profile image URL -->
            <img src="" alt="Profile Picture" class="profile-img" />

            <!-- STUDENT TASK: Change this to your name -->
            <h1>@YourHandle</h1>

            <!-- STUDENT TASK: Add a short bio -->
            <p class="bio">
                Welcome to my links! Check out what I'm working on.
            </p>
        </div>

        <div class="links-container">
            <!-- STUDENT TASK: Update the href and text for each link -->
            <a
                href="https://www.youtube.com/watch?v=oHg5SJYRHA0"
                class="link-button"
                target="_blank"
                >GitHub</a
            >
            <a href="https://linkedin.com" class="link-button" target="_blank"
                >LinkedIn</a
            >
            <a href="https://twitter.com" class="link-button" target="_blank"
                >Twitter / X</a
            >
            <a
                href="https://yourportfolio.com"
                class="link-button"
                target="_blank"
                >Portfolio Site</a
            >
        </div>

        <footer>Unity Urban Tech Project</footer>
    </body>
</html>
